name: deploy

# Manual on purpose: a push publishing an image must not change production.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g. 1.2.3, a short SHA, or a branch tag)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid version"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "cd ~/notiforwarder && sed -i 's/^VERSION=.*/VERSION=$VERSION/' .env && docker compose pull && docker compose up -d"
