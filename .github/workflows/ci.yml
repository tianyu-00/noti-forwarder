name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  test-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: notiforwarder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Publishing only happens after every test job is green, and only from the publish branch.
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and start the stack (nginx, server)
        run: docker compose -p notiforwarder-e2e -f e2e/docker-compose.yml up -d --build
      - name: Log in, pair a phone, send a message, see it arrive
        run: node e2e/run.mjs
      - name: Install the browser test tools
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: The same in a real browser (log in, add a phone, live message, search)
        run: npx playwright test
        working-directory: e2e
      - name: Stack logs (only on failure, no message text is logged)
        if: failure()
        run: docker compose -p notiforwarder-e2e -f e2e/docker-compose.yml logs --no-color --tail 80
      - if: always()
        run: docker compose -p notiforwarder-e2e -f e2e/docker-compose.yml down -v

  publish:
    needs: [test-server, test-web, test-android, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/publish'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [server, web]
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "name=$(tr -d '\n' < VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/notiforwarder-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          # Host architecture is unconfirmed; build both until it is.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  # A signed Android APK attached to a GitHub Release, built from the same commit and version as
  # the images. Needs the signing secrets below; without them the debug key is used (see README).
  release-android:
    needs: [test-server, test-web, test-android, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        working-directory: .
        run: |
          name="$(tr -d '\n' < VERSION).${{ github.run_number }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Signing key
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key. A phone cannot update this app in place later."
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "notiforwarder-${{ steps.version.outputs.name }}.apk"
          gh release create "v${{ steps.version.outputs.name }}" "notiforwarder-${{ steps.version.outputs.name }}.apk" \
            --target "${{ github.sha }}" --title "Notiforwarder ${{ steps.version.outputs.name }}" \
            --notes "Android app ${{ steps.version.outputs.name }} (sideload this APK). Server and web images for the same commit: sha-${GITHUB_SHA::7}."
