# Throwaway stack for the end-to-end test: built from this checkout, its own empty database (a file
# inside the container, gone with `down -v`), port 3100.
# Run with: docker compose -p notiforwarder-e2e -f e2e/docker-compose.yml up -d --build
# The values below are test-only and never used anywhere real.
services:
  web:
    build:
      context: ../web
    depends_on:
      - server
    ports:
      - "127.0.0.1:3100:80"

  server:
    build:
      context: ../server
    environment:
      PUBLIC_URL: http://localhost:3100
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-test-password-123
      TRUST_PROXY: "1"
    volumes:
      - e2e-data:/data

volumes:
  e2e-data:
