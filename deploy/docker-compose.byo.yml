# Notiforwarder with your own PostgreSQL and your own cloudflared.
# Only three values are required. Set them as environment variables (in your manager's env
# panel or a .env file next to this file):
#   DATABASE_URL    postgres://notiforwarder:PASSWORD@HOST:5432/notiforwarder
#   PUBLIC_URL      https://notifications.example.com   (your tunnel address, no trailing slash)
#   ADMIN_PASSWORD  at least 12 characters
# Everything else has a default. Optional: ADMIN_USERNAME (admin), VERSION (latest),
# WEB_BIND (3000), TRUST_PROXY (2), GHCR_OWNER (tianyu-00), SECRET_KEY (off).
#
# Point your tunnel's service (type HTTP) at  http://<this machine's address>:3000
services:
  web:
    image: ghcr.io/${GHCR_OWNER:-tianyu-00}/notiforwarder-web:${VERSION:-latest}
    container_name: notiforwarder-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Port 3000 on this machine, reachable from your network so a cloudflared container or
      # another machine can connect. To allow only this machine itself: WEB_BIND=127.0.0.1:3000
      - "${WEB_BIND:-3000}:80"

  server:
    image: ghcr.io/${GHCR_OWNER:-tianyu-00}/notiforwarder-server:${VERSION:-latest}
    restart: unless-stopped
    environment:
      # postgres://notiforwarder:PASSWORD@192.168.1.10:5432/notiforwarder
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      # https://notifications.example.com
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      # At least 12 characters
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Optional: encrypts the two-step login secret in the database (at least 32 characters).
      SECRET_KEY: ${SECRET_KEY:-}
      # Minutes without contact before a phone counts as quiet (0 = off). Phones check in every ~15.
      SILENT_AFTER_MINUTES: ${SILENT_AFTER_MINUTES:-}
      # Optional push alerts through ntfy; leave unset to keep them off.
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_MODE: ${NTFY_MODE:-}
      NTFY_TYPES: ${NTFY_TYPES:-}
      NTFY_APPS_BLOCK: ${NTFY_APPS_BLOCK:-}
      NTFY_INCLUDE_BODY: ${NTFY_INCLUDE_BODY:-}
    # Lets DATABASE_URL use host.docker.internal when PostgreSQL runs on this same machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
