services:
  # Single public entry point: serves the dashboard and proxies /api to the server.
  # Point the Cloudflare tunnel at http://localhost:3000 (or http://web:80 from another container).
  web:
    image: ghcr.io/${GHCR_OWNER}/notiforwarder-web:${VERSION}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:3000:80"

  server:
    image: ghcr.io/${GHCR_OWNER}/notiforwarder-server:${VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://notiforwarder:${POSTGRES_PASSWORD}@db:5432/notiforwarder
      PUBLIC_URL: ${PUBLIC_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notiforwarder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notiforwarder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notiforwarder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
