services:
  # Single public entry point: serves the dashboard and proxies /api to the server.
  # Put an HTTPS proxy or tunnel in front of http://localhost:3000 for the full feature set.
  web:
    image: ghcr.io/${GHCR_OWNER}/notiforwarder-web:${VERSION}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:3000:80"

  server:
    image: ghcr.io/${GHCR_OWNER}/notiforwarder-server:${VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      # The whole database is one file in here. Keep this volume: it is all your messages.
      - data:/data

volumes:
  data:
